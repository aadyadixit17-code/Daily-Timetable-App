<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Routine Timetable</title>
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --primary: #db2777; /* Dark Pink / Crimson */
            --primary-hover: #be185d; /* Darker Pink */
            --border-color: #e2e8f0;
            --success-bg: rgba(240, 253, 244, 0.95);
            --success-text: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-image: url('https://i0.wp.com/picjumbo.com/wp-content/uploads/christmas-greeting-card-background-free-image.jpeg?w=600&quality=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.2), 0 8px 10px -6px rgb(0 0 0 / 0.2);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .date-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="date"] {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-main);
            background: #fff;
            outline: none;
        }

        input[type="date"]:focus {
            border-color: var(--primary);
        }

        .progress-bar-container {
            background: var(--border-color);
            border-radius: 999px;
            height: 8px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 50vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .task-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fff;
            transition: all 0.2s ease;
        }

        .task-item.completed {
            background-color: var(--success-bg);
            border-color: #bbf7d0;
        }

        .task-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        .task-left input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .task-title {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--success-text);
        }

        .task-time {
            font-size: 0.85rem;
            color: var(--text-sub);
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .task-details {
            font-size: 0.85rem;
            color: var(--text-sub);
            padding-left: 30px;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            padding-left: 30px;
        }

        .btn-text {
            background: none;
            border: none;
            font-size: 0.75rem;
            color: var(--text-sub);
            cursor: pointer;
            padding: 0;
        }

        .btn-text:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .btn-text.delete:hover {
            color: #ef4444;
        }

        .add-task-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .add-task-form input, .add-task-form textarea {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background: #fff;
        }

        .add-task-form input:focus, .add-task-form textarea:focus {
            border-color: var(--primary);
        }

        .add-row {
            display: flex;
            gap: 10px;
        }

        .add-row input {
            flex: 1;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Daily Routine Timetable</h1>
        <div class="date-picker-wrapper">
            <input type="date" id="dateSelector" onchange="changeDate()">
        </div>
    </header>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <form class="add-task-form" onsubmit="addTask(event)">
        <div class="add-row">
            <input type="text" id="taskTitleInput" placeholder="Task name (e.g., Reading)" required>
            <input type="text" id="taskTimeInput" placeholder="Duration/Time (e.g., 30 mins)">
        </div>
        <textarea id="taskDetailsInput" placeholder="Add extra details/notes (optional)" rows="2"></textarea>
        <button type="submit" class="btn-primary">Add Task</button>
    </form>
</div>

<script>
    function getLocalDateString(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    let currentDate = getLocalDateString();
    
    const defaultTasks = [
        { id: '1', title: 'Coloring', time: '30 minutes', details: 'Creativity and relaxation' },
        { id: '2', title: 'LinkedIn', time: '30 minutes', details: 'Profile, networking and updates' },
        { id: '3', title: 'Walk', time: '30 minutes', details: 'Walking and light movement' },
        { id: '4', title: 'Phone Updates', time: '20 minutes', details: 'Messages and essential updates' },
        { id: '5', title: 'Daily Diary & Quotes', time: '10 minutes', details: 'Write your thoughts and a quote' },
        { id: '6', title: 'Spiritual Time', time: '10 minutes', details: 'Prayer, meditation or reflection' }
    ];

    function initApp() {
        const dateInput = document.getElementById('dateSelector');
        dateInput.value = currentDate;
        
        if (!localStorage.getItem('timetable_master_tasks')) {
            localStorage.setItem('timetable_master_tasks', JSON.stringify(defaultTasks));
        }

        checkAndCreateDayStatus(currentDate);
        render();
    }

    function checkAndCreateDayStatus(dateStr) {
        const statusKey = `timetable_status_${dateStr}`;
        if (!localStorage.getItem(statusKey)) {
            const masterTasks = JSON.parse(localStorage.getItem('timetable_master_tasks')) || [];
            const initialStatus = {};
            masterTasks.forEach(task => {
                initialStatus[task.id] = false;
            });
            localStorage.setItem(statusKey, JSON.stringify(initialStatus));
        }
    }

    function changeDate() {
        const selected = document.getElementById('dateSelector').value;
        if (selected) {
            currentDate = selected;
            checkAndCreateDayStatus(currentDate);
            render();
        }
    }

    function toggleTask(taskId) {
        const statusKey = `timetable_status_${currentDate}`;
        let status = JSON.parse(localStorage.getItem(statusKey)) || {};
        status[taskId] = !status[taskId];
        localStorage.setItem(statusKey, JSON.stringify(status));
        render();
    }

    function deleteTask(taskId) {
        if (confirm("Are you sure you want to delete this task from your daily routine?")) {
            let masterTasks = JSON.parse(localStorage.getItem('timetable_master_tasks')) || [];
            masterTasks = masterTasks.filter(t => t.id !== taskId);
            localStorage.setItem('timetable_master_tasks', JSON.stringify(masterTasks));
            render();
        }
    }

    function addTask(e) {
        e.preventDefault();
        const titleInput = document.getElementById('taskTitleInput');
        const timeInput = document.getElementById('taskTimeInput');
        const detailsInput = document.getElementById('taskDetailsInput');

        const newTask = {
            id: '_' + Math.random().toString(36).substring(2, 9),
            title: titleInput.value.trim(),
            time: timeInput.value.trim(),
            details: detailsInput.value.trim()
        };

        let masterTasks = JSON.parse(localStorage.getItem('timetable_master_tasks')) || [];
        masterTasks.push(newTask);
        localStorage.setItem('timetable_master_tasks', JSON.stringify(masterTasks));

        const statusKey = `timetable_status_${currentDate}`;
        let status = JSON.parse(localStorage.getItem(statusKey)) || {};
        status[newTask.id] = false;
        localStorage.setItem(statusKey, JSON.stringify(status));

        titleInput.value = '';
        timeInput.value = '';
        detailsInput.value = '';

        render();
    }

    function render() {
        const taskListEl = document.getElementById('taskList');
        const progressBarEl = document.getElementById('progressBar');
        
        const masterTasks = JSON.parse(localStorage.getItem('timetable_master_tasks')) || [];
        const statusKey = `timetable_status_${currentDate}`;
        const status = JSON.parse(localStorage.getItem(statusKey)) || {};

        taskListEl.innerHTML = '';

        if (masterTasks.length === 0) {
            taskListEl.innerHTML = `<div class="empty-state">No routine tasks found. Add one below!</div>`;
            progressBarEl.style.width = '0%';
            return;
        }

        let completedCount = 0;

        masterTasks.forEach(task => {
            const isCompleted = !!status[task.id];
            if (isCompleted) completedCount++;

            const li = document.createElement('li');
            li.className = `task-item ${isCompleted ? 'completed' : ''}`;
            
            li.innerHTML = `
                <div class="task-main-row">
                    <div class="task-left" onclick="toggleTask('${task.id}')">
                        <input type="checkbox" ${isCompleted ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${task.id}')">
                        <span class="task-title">${escapeHtml(task.title)}</span>
                    </div>
                    ${task.time ? `<span class="task-time">${escapeHtml(task.time)}</span>` : ''}
                </div>
                ${task.details ? `<div class="task-details">${escapeHtml(task.details)}</div>` : ''}
                <div class="task-actions">
                    <button class="btn-text delete" onclick="deleteTask('${task.id}')">Delete</button>
                </div>
            `;
            taskListEl.appendChild(li);
        });

        const progressPercent = Math.round((completedCount / masterTasks.length) * 100);
        progressBarEl.style.width = `${progressPercent}%`;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    initApp();
</script>

</body>
</html>
